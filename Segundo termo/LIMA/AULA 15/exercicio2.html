<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FactoryConnect</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 8px;
        }

        .container-principal {
            background: linear-gradient(120deg, #10445c, #176f91);
            border-radius: 17px;
            padding: 30px 26px 26px;
            color: white;
            max-width: 100%;
        }

        .titulo {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 14px;
        }

        .descricao {
            font-size: 14px;
            color: #e1eaf0;
            margin-bottom: 19px;
        }

        .area {
            background-color: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 11px;
            min-height: 51px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .botao-area {
            background-color: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.20);
            color: white;
            border-radius: 11px;
            padding: 10px 14px;
            font-size: 14px;
            transition: 0.3s;
        }

        .botao-area:hover {
            background-color: rgba(255, 255, 255, 0.28);
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="container-principal">

            <h1 class="titulo">
                FactoryConnect - Portal de Gestão Industrial
            </h1>

            <p class="descricao">
                Uma indústria está digitalizando seus processos e contratou a DevSolutions para criar uma interface
                Web responsiva que centralize informações das principais áreas.
            </p>

            <div class="row g-3">

                <div class="col-12 col-md-4">
                    <div class="area">
                        <button class="btn botao-area">Produção</button>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="area">
                        <button class="btn botao-area">Manutenção</button>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="area">
                        <button class="btn botao-area">Qualidade</button>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="area">
                        <button class="btn botao-area">Logística</button>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="area">
                        <button class="btn botao-area">Segurança</button>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="area">
                        <button class="btn botao-area">Tecnologia</button>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
